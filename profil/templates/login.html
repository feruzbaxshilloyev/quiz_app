<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Tizimga kirish</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f1f1f1;
        }
        .login-form {
            max-width: 400px;
            margin: 100px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
<div class="login-form">
    <h3 class="mb-4 text-center">🔐 Tizimga kirish</h3>
    <form method="post">
        {% csrf_token %}
        {% if form.errors %}
            <div class="alert alert-danger">
                Login yoki parol noto‘g‘ri!
            </div>
        {% endif %}

        <div class="mb-3">
            <label for="username" class="form-label">Foydalanuvchi nomi</label>
            <input type="text" name="username" id="username" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Parol</label>
            <input type="password" name="password" id="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Kirish</button>
    </form>
    <p class="mt-3 text-center">
        Hisobingiz yo‘qmi? <a href="{% url 'profil:register' %}">Ro‘yxatdan o‘tish</a>
    </p>
</div>
</body>
</html>
