<!-- templates/edit_profile.html -->
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Profilni tahrirlash</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        .form-container {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .btn-custom {
            background-color: #0d6efd;
            color: white;
            border-radius: 20px;
        }
        .btn-custom:hover {
            background-color: #6610f2;
        }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="form-container">
        <h2 class="text-center mb-4">Profilni tahrirlash</h2>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}

            <div class="mb-3">
                <label for="id_image" class="form-label">Profil rasmini yangilash</label>
                <input type="file" class="form-control" id="id_image" name="image" accept="image/*">
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-custom btn-lg">
                    <i class="fa-solid fa-save me-2"></i> Saqlash
                </button>
            </div>
        </form>

        <div class="text-center mt-4">
            <a href="{% url 'profil:profil' %}" class="btn btn-outline-secondary">Orqaga</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
