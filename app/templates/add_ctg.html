<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>➕ Kategoriya qo‘shish</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .form-container {
            max-width: 500px;
            margin: auto;
            margin-top: 80px;
            padding: 30px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
<div class="container">
    <div class="form-container">
        <h3 class="mb-4 text-center">➕ Yangi Kategoriya Qo‘shish</h3>
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Kategoriya nomi</label>
                <input type="text" name="name" class="form-control" placeholder="Masalan: Matematika" required>
            </div>
            <button type="submit" class="btn btn-success w-100">✅ Qo‘shish</button>
            <a href="{% url 'app:home' %}" class="btn btn-secondary w-100 mt-2">⬅️ Ortga</a>
        </form>
    </div>
</div>
</body>
</html>
